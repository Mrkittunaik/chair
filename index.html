<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRABOT. — Furniture for modern homes and workspaces</title>
<meta name="description" content="Premium sofas, office furniture, beds, dining and gaming setups. Built for everyday comfort and lasting quality.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16241E;
  --ink-soft:#4B5A52;
  --stone:#ECEAE3;
  --stone-deep:#DFDCD2;
  --paper:#FFFFFF;
  --line:#D8D4C8;
  --brass:#9A742C;
  --sage:#5E7263;
  --radius:3px;
  --radius-lg:10px;
  --max-w:1240px;
  --header-h:76px;
  --shadow:0 10px 30px rgba(22,36,30,.08);
  --serif:'Fraunces',Georgia,serif;
  --sans:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--stone);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
ul{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4,p{margin:0;}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;line-height:1.12;}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

.container{max-width:var(--max-w);margin:0 auto;padding:0 24px;}
.section{padding:64px 0;}
.section-tight{padding-top:0;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;}
.section-head h2{font-size:30px;}
.section-sub{color:var(--ink-soft);font-size:14px;margin-top:6px;max-width:58ch;}
.view-all{font-size:13px;font-weight:600;border-bottom:1px solid var(--ink);padding-bottom:2px;white-space:nowrap;}
.page-head{background:var(--paper);border-bottom:1px solid var(--line);padding:46px 0 38px;}
.page-title{font-size:38px;}
.page-desc{color:var(--ink-soft);margin-top:10px;max-width:62ch;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;
  border-radius:var(--radius);font-size:13px;font-weight:700;letter-spacing:.01em;
  border:1px solid transparent;transition:background .18s,color .18s,border-color .18s;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#0D1712;}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink);}
.btn-secondary:hover{background:var(--ink);color:#fff;}
.btn-ghost{background:var(--paper);border-color:var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:9px 15px;font-size:12px;}
.btn:active{transform:translateY(1px);}

/* Header */
body{padding-top:var(--header-h);}
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:90;
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid rgba(216,212,200,.7);
  transition:background .3s,backdrop-filter .3s,box-shadow .25s,border-color .3s;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .site-header{background:rgba(255,255,255,.95);}
}
.site-header.scrolled{
  background:rgba(255,255,255,.74);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);
}
.header-search input,.mobile-search input{
  background:rgba(236,234,227,.66);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-color:rgba(216,212,200,.9);
}
.header-search input:focus,.mobile-search input:focus{background:rgba(255,255,255,.95);}
.icon-btn:hover{background:rgba(22,36,30,.07);}
.header-inner{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:22px;}
.logo{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.02em;flex-shrink:0;}
.main-nav{display:flex;gap:22px;flex-shrink:0;}
.main-nav a{font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:4px 0;border-bottom:1.5px solid transparent;}
.main-nav a:hover{color:var(--ink);}
.main-nav a.active{color:var(--ink);border-bottom-color:var(--brass);}
.header-search{flex:1;max-width:420px;margin-left:auto;position:relative;}
.header-search input{
  width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--stone);}
.header-search input:focus{outline:none;border-color:var(--ink);background:#fff;}
.header-search .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft);pointer-events:none;}
.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto;}
.icon-group{display:flex;align-items:center;gap:2px;background:rgba(22,36,30,.05);border-radius:100px;padding:3px;}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;background:none;border:none;color:var(--ink);border-radius:var(--radius);}
.icon-btn:hover{background:var(--stone);}
.icon-btn svg{width:20px;height:20px;}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--brass);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;}
.menu-toggle{display:none;}
.mobile-search{display:none;padding:0 24px 12px;}

/* Hero */
.hero{background:var(--paper);border-bottom:1px solid var(--line);}
.hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:52px;align-items:center;padding:70px 24px 74px;}
.hero h1{font-size:clamp(34px,4.6vw,58px);}
.hero .kicker{font-family:var(--serif);font-size:14px;color:var(--brass);margin-bottom:18px;}
.hero p.lead{color:var(--ink-soft);margin-top:20px;max-width:46ch;}
.hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;}
.hero-image{border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.hero-image img{aspect-ratio:4/3;object-fit:cover;width:100%;}
.hero-marks{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap;}
.hero-marks div{font-size:12.5px;color:var(--ink-soft);}
.hero-marks strong{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:600;}

/* Category rail */
.cat-rail{display:grid;grid-template-columns:repeat(9,1fr);gap:14px;}
.cat-card{text-align:center;}
.cat-card .cat-img{border-radius:50%;overflow:hidden;aspect-ratio:1;border:1px solid var(--line);background:#fff;}
.cat-card img{width:100%;height:100%;object-fit:cover;}
.cat-card:hover .cat-img{border-color:var(--ink);}
.cat-name{font-size:12.5px;font-weight:600;margin-top:10px;}

/* Collections */
.grid-collections{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.collection-card{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:#000;}
.collection-card img{aspect-ratio:4/3;object-fit:cover;width:100%;opacity:.86;transition:opacity .25s,transform .4s;}
.collection-card:hover img{opacity:.7;transform:scale(1.03);}
.collection-card .overlay{position:absolute;left:0;right:0;bottom:0;padding:20px;color:#fff;
  background:linear-gradient(to top,rgba(10,18,14,.8),transparent);}
.collection-card .cname{font-size:12px;font-weight:700;color:#E2CFA3;}
.collection-card .ctitle{font-family:var(--serif);font-size:19px;margin-top:4px;line-height:1.2;}

/* Product cards */
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.product-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;}
.product-card:hover{border-color:var(--ink);}
.pc-media{position:relative;background:var(--stone-deep);}
.pc-media img{aspect-ratio:1;object-fit:cover;width:100%;}
.pc-wish{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);}
.pc-wish svg{width:16px;height:16px;}
.pc-wish.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.pc-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.pc-cat{font-size:11.5px;color:var(--ink-soft);}
.pc-name{font-size:14.5px;font-weight:600;line-height:1.35;}
.pc-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px;}
.pc-price{font-family:var(--serif);font-size:17px;font-weight:600;}
.pc-rating{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;}
.pc-rating svg{width:13px;height:13px;color:var(--brass);}
.pc-actions{margin-top:10px;}

/* Search page */
.search-hero{background:var(--paper);border-bottom:1px solid var(--line);padding:44px 0 34px;}
.search-form{display:flex;gap:10px;margin-top:20px;max-width:640px;}
.search-form input{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--stone);}
.search-form input:focus{outline:none;border-color:var(--ink);background:#fff;}
.suggest-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center;}
.suggest-row span{font-size:12.5px;color:var(--ink-soft);}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:600;}
.chip:hover{border-color:var(--ink);}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.result-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.filters-toggle{display:none;}
.filters-head{display:none;}
.filters-actions{display:none;}
.filters-backdrop{display:none;}
.result-count{font-size:13.5px;color:var(--ink-soft);}
.empty-state{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:56px 28px;text-align:center;}
.empty-state h3{font-size:22px;}
.empty-state p{color:var(--ink-soft);margin:10px auto 20px;max-width:46ch;}

/* Filters */
.shop-layout{display:grid;grid-template-columns:238px 1fr;gap:34px;align-items:start;}
.filters{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;position:sticky;top:calc(var(--header-h) + 18px);}
.filter-block{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line);}
.filter-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.filter-block h4{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:10px;}
.filter-block label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);padding:3px 0;cursor:pointer;}
.filter-block label:hover{color:var(--ink);}
.filter-block input[type=checkbox]{accent-color:var(--ink);width:15px;height:15px;}
select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);}
.range-row{display:flex;gap:8px;}
.range-row input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);}

/* Product detail */
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:46px;align-items:start;}
.pdp-media{border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);background:#fff;}
.pdp-media img{aspect-ratio:1;object-fit:cover;width:100%;}
.pdp h1{font-size:32px;margin:8px 0 12px;}
.pdp .price{font-family:var(--serif);font-size:28px;font-weight:600;margin:14px 0;}
.spec-table{width:100%;border-collapse:collapse;margin-top:22px;font-size:13.5px;}
.spec-table td{padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink-soft);}
.spec-table td:first-child{width:40%;color:var(--ink);font-weight:600;}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;}
.qty button{width:38px;height:42px;background:none;border:none;font-size:17px;color:var(--ink);}
.qty button:hover{background:var(--stone);}
.qty span{min-width:38px;text-align:center;font-weight:700;font-size:14px;}
.pdp-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.breadcrumb{font-size:12.5px;color:var(--ink-soft);}
.breadcrumb a:hover{color:var(--ink);text-decoration:underline;}

/* Cart & wishlist pages */
.cart-layout{display:grid;grid-template-columns:1fr 340px;gap:30px;align-items:start;}
.cart-list{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;}
.cart-row{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:18px;border-bottom:1px solid var(--line);align-items:center;}
.cart-row:last-child{border-bottom:none;}
.cart-row img{width:96px;height:96px;object-fit:cover;border-radius:var(--radius);}
.cart-row .nm{font-weight:600;font-size:14.5px;}
.cart-row .ct{font-size:12.5px;color:var(--ink-soft);}
.cart-row .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.link-btn{background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;padding:0;}
.link-btn:hover{color:var(--ink);}
.summary{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;position:sticky;top:calc(var(--header-h) + 18px);}
.summary h3{font-size:19px;margin-bottom:16px;}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);padding:7px 0;}
.sum-total{display:flex;justify-content:space-between;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);
  border-top:1px solid var(--line);margin-top:10px;padding-top:14px;}

/* About / contact */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:46px;align-items:center;}
.about-img{border-radius:var(--radius-lg);overflow:hidden;}
.about-img img{aspect-ratio:4/3;object-fit:cover;width:100%;}
.about-copy h2{font-size:30px;margin-bottom:14px;}
.about-copy p{color:var(--ink-soft);}
.stat-row{display:flex;gap:34px;margin-top:26px;flex-wrap:wrap;}
.stat .num{font-family:var(--serif);font-size:27px;font-weight:600;}
.stat .lbl{font-size:12.5px;color:var(--ink-soft);}
.value-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.value-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;}
.value-card h3{font-size:18px;margin-bottom:8px;}
.value-card p{font-size:13.5px;color:var(--ink-soft);}
.contact-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:38px;align-items:start;}
.form-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--stone);}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink);background:#fff;}
.field textarea{min-height:120px;resize:vertical;}
.info-line{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.info-line strong{min-width:84px;}

/* Promo */
.promo{position:relative;border-radius:var(--radius-lg);overflow:hidden;}
.promo img{width:100%;height:340px;object-fit:cover;}
.promo .promo-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;
  padding:0 56px;color:#fff;background:linear-gradient(to right,rgba(12,22,17,.82),rgba(12,22,17,.15));}
.promo h2{font-size:32px;max-width:16ch;}
.promo p{max-width:42ch;color:#E6E3D8;}
.promo .btn-primary{background:#fff;color:var(--ink);align-self:flex-start;}
.promo .btn-primary:hover{background:#E2CFA3;}

/* Footer */
.site-footer{background:var(--ink);color:#DCE0DB;margin-top:20px;}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.3fr;gap:36px;padding:56px 24px 40px;}
.site-footer .logo{color:#fff;}
.site-footer p{font-size:13.5px;color:#A9B5AC;margin-top:12px;max-width:34ch;}
.site-footer h4{font-family:var(--serif);font-size:15px;color:#fff;margin-bottom:12px;font-weight:600;}
.site-footer li{padding:5px 0;font-size:13.5px;color:#A9B5AC;}
.site-footer li a:hover{color:#fff;}
.news-row{display:flex;gap:8px;margin-top:12px;}
.news-row input{flex:1;padding:11px 12px;border:1px solid #33463C;background:#0F1A15;color:#fff;border-radius:var(--radius);}
.news-row input::placeholder{color:#7E8C83;}
.news-row .btn{background:#E2CFA3;color:var(--ink);}
.footer-base{border-top:1px solid #29382F;padding:18px 24px;display:flex;justify-content:space-between;gap:14px;font-size:12.5px;color:#8C9A91;flex-wrap:wrap;}

/* Toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:100px;font-size:13px;font-weight:600;z-index:200;
  transition:opacity .2s,transform .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}


/* ---- Image loading + placeholders ---- */
.img-wrap{position:relative;background:var(--stone-deep);overflow:hidden;}
img.lazy-img{opacity:0;transition:opacity .45s ease;}
img.lazy-img.loaded{opacity:1;}
.shimmer::after{content:none;}

/* ---- Entrance motion ---- */
.reveal{opacity:0;transform:translateY(14px);}
.reveal.in{opacity:1;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1);}
.hero-copy-anim > *{opacity:0;transform:translateY(16px);animation:riseIn .7s cubic-bezier(.2,.7,.3,1) forwards;}
.hero-copy-anim > *:nth-child(1){animation-delay:.05s;}
.hero-copy-anim > *:nth-child(2){animation-delay:.14s;}
.hero-copy-anim > *:nth-child(3){animation-delay:.23s;}
.hero-copy-anim > *:nth-child(4){animation-delay:.32s;}
.hero-copy-anim > *:nth-child(5){animation-delay:.41s;}
.hero .hero-image{animation:heroImg .9s cubic-bezier(.2,.7,.3,1) both;}
@keyframes riseIn{to{opacity:1;transform:none;}}
@keyframes heroImg{from{opacity:0;transform:scale(1.04);}to{opacity:1;transform:none;}}

/* ---- Interaction motion ---- */
.product-card{transition:none;border-color:var(--line)!important;box-shadow:none!important;}
.product-card:focus,.product-card:focus-within,.pc-media img:focus{outline:none;}
.pc-media{border:none;}
.pc-wish{transition:transform .18s,background .18s,color .18s;}
.pc-wish:active{transform:scale(.88);}
.pc-wish.pop{animation:pop .35s ease;}
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.25);}100%{transform:scale(1);}}
.cat-card .cat-img{transition:transform .3s cubic-bezier(.2,.7,.3,1),border-color .2s;}
.cat-card:hover .cat-img{transform:translateY(-3px);}
.chip{transition:background .18s,color .18s,border-color .18s,transform .18s;}
.chip:active{transform:scale(.96);}
.view-all{transition:opacity .2s;}
.site-header{transition:box-shadow .25s;}
.site-header.scrolled{box-shadow:0 8px 28px rgba(22,36,30,.10);}
.badge{animation:pop .35s ease;}
.cart-row{animation:riseIn .4s ease both;}
#app{animation:pageIn .35s ease both;}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){
  .reveal,.hero-copy-anim > *,.hero .hero-image,#app,.cart-row{opacity:1!important;transform:none!important;animation:none!important;}
  .shimmer::after{animation:none;}
}

/* Responsive */
@media (max-width:1080px){
  .cat-rail{grid-template-columns:repeat(5,1fr);}
  .grid-collections{grid-template-columns:repeat(2,1fr);}
  .product-grid{grid-template-columns:repeat(3,1fr);}
  .footer-grid{grid-template-columns:1fr 1fr;}
}
@media (max-width:900px){
  :root{--header-h:64px;}
  .header-inner{gap:12px;}
  .logo{font-size:20px;}
  .header-search{display:none;}
  .mobile-search{display:block;padding:0 16px 12px;}
  .main-nav{display:none;}
  .main-nav.open{display:flex;position:fixed;top:var(--header-h);left:0;right:0;
    background:#fff;
    flex-direction:column;gap:0;padding:8px 20px 20px;z-index:97;
    max-height:calc(100vh - var(--header-h));overflow:auto;
    box-shadow:0 18px 40px rgba(22,36,30,.16);
    animation:navSlide .22s cubic-bezier(.2,.7,.3,1) both;}
  .main-nav.open a{padding:14px 0;border-bottom:1px solid var(--line);font-size:15.5px;}
  @keyframes navSlide{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
  .menu-toggle{display:grid;}
  .nav-backdrop{display:none;position:fixed;inset:0;top:var(--header-h);background:rgba(15,22,18,.42);z-index:96;}
  .nav-backdrop.show{display:block;animation:backdropIn .22s ease both;}
  @keyframes backdropIn{from{opacity:0;}to{opacity:1;}}
  body.nav-locked{overflow:hidden;}
  .header-actions{gap:6px;}
  .icon-group{gap:0;padding:2px;}
  body{padding-top:calc(var(--header-h) + 60px);}
  .container{padding:0 16px;}
  .hero-grid{grid-template-columns:1fr;padding:36px 16px 40px;gap:26px;}
  .hero h1{font-size:clamp(28px,7vw,40px);}
  .hero-actions{flex-direction:column;align-items:stretch;}
  .hero-actions .btn{width:100%;}
  .hero-marks{gap:20px;}
  .pdp,.about-grid,.contact-grid,.cart-layout{grid-template-columns:1fr;}
  .summary{position:static;}
  .shop-layout{grid-template-columns:1fr;}
  .filters{display:none;}
  .filter-bar{
    display:flex;gap:8px;padding:2px 0 4px;margin-bottom:6px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .filter-bar-item{position:relative;flex-shrink:0;}
  .filter-bar-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;border:1px solid var(--line);border-radius:100px;
    background:var(--paper);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;
  }
  .filter-bar-item.open .filter-bar-btn{background:var(--ink);color:#fff;border-color:var(--ink);}
  .filter-bar-item.open .chev{transform:rotate(180deg);}
  .chev{font-size:10px;transition:transform .18s;}
  .filter-bar-clear{flex-shrink:0;padding:9px 14px;border:1px solid var(--line);border-radius:100px;background:var(--paper);font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .filter-drop{
    display:none;position:fixed;top:0;left:0;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);
    box-shadow:0 14px 34px rgba(22,36,30,.16);padding:14px;min-width:220px;max-width:80vw;z-index:99;
    animation:navSlide .18s ease both;
  }
  .filter-bar-item.open .filter-drop{display:block;}
  .filter-drop label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);padding:6px 2px;white-space:nowrap;}
  .filter-drop input[type=radio],.filter-drop input[type=checkbox]{accent-color:var(--ink);width:15px;height:15px;flex-shrink:0;}
  .filter-drop .range-row input{width:90px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);}
  .filter-bar-backdrop{display:none;position:fixed;inset:0;top:calc(var(--header-h) + 1px);background:rgba(15,22,18,.28);z-index:94;}
  .filter-bar-backdrop.show{display:block;animation:backdropIn .18s ease both;}
  .promo .promo-in{padding:0 22px;background:linear-gradient(to right,rgba(12,22,17,.88),rgba(12,22,17,.55));}
  .promo img{height:280px;}
  .promo h2{font-size:26px;}
  .section{padding:48px 0;}
  .section-head{flex-direction:column;align-items:flex-start;gap:8px;}
  .about-grid{gap:26px;}
  .pdp-media{order:-1;}
  .pdp h1{font-size:26px;}
  .contact-grid{gap:26px;}
}
@media (max-width:640px){
  :root{--header-h:60px;}
  .logo{font-size:19px;}
  .icon-btn{width:38px;height:38px;}
  .product-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .pc-body{padding:11px 12px 13px;gap:5px;}
  .pc-name{font-size:13.5px;}
  .pc-price{font-size:15.5px;}
  .cat-rail{grid-template-columns:repeat(3,1fr);gap:10px;}
  .cat-name{font-size:11.5px;}
  .grid-collections,.value-grid{grid-template-columns:1fr;}
  .collection-card .ctitle{font-size:16px;}
  .footer-grid{grid-template-columns:1fr;gap:28px;padding:44px 16px 32px;}
  .footer-base{padding:16px;flex-direction:column;gap:6px;text-align:center;}
  .section{padding:38px 0;}
  .page-head{padding:32px 0 26px;}
  .page-title{font-size:26px;}
  .page-desc{font-size:13.5px;}
  .section-head h2{font-size:21px;}
  .hero-marks{gap:16px 22px;}
  .hero-marks strong{font-size:17px;}
  .cart-row{grid-template-columns:64px 1fr;padding:14px;gap:12px;}
  .cart-row img{width:64px;height:64px;}
  .cart-row .rt{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;width:100%;}
  .summary{padding:18px;}
  .pdp-actions{flex-direction:column;align-items:stretch;}
  .pdp-actions .qty{justify-content:center;}
  .pdp .price{font-size:24px;}
  .value-card{padding:20px;}
  .stat-row{gap:22px;}
  .stat .num{font-size:22px;}
  .form-card{padding:20px;}
  .search-form{flex-direction:column;}
  .search-form .btn{width:100%;}
  .result-bar{flex-direction:column;align-items:flex-start;gap:12px;}
  .result-bar > div:last-child{width:100%;display:flex;justify-content:space-between;}
  select{width:100%;}
}
@media (max-width:380px){
  .cat-rail{grid-template-columns:repeat(2,1fr);}
  .product-grid{grid-template-columns:1fr;}
}

const Store = {
  cartKey:"prabot_cart", wishKey:"prabot_wish",
  read(k){ try{ return JSON.parse(localStorage.getItem(k)) || (k===this.cartKey?{}:[]); }catch(e){ return k===this.cartKey?{}:[]; } },
  write(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  getCart(){ return this.read(this.cartKey); },
  setCart(c){ this.write(this.cartKey,c); syncBadges(); },
  addToCart(id,qty){ const c=this.getCart(); c[id]=(c[id]||0)+(qty||1); this.setCart(c); },
  setQty(id,q){ const c=this.getCart(); if(q<=0) delete c[id]; else c[id]=q; this.setCart(c); },
  removeFromCart(id){ const c=this.getCart(); delete c[id]; this.setCart(c); },
  cartCount(){ return Object.values(this.getCart()).reduce((a,b)=>a+b,0); },
  cartTotal(){ return Object.entries(this.getCart()).reduce((sum,[id,q])=>{ const p=findProduct(id); return sum + (p? p.price*q : 0); },0); },
  getWish(){ return this.read(this.wishKey); },
  setWish(w){ this.write(this.wishKey,w); syncBadges(); },
  inWish(id){ return this.getWish().includes(id); },
  toggleWish(id){ const w=this.getWish(); const i=w.indexOf(id); if(i>-1) w.splice(i,1); else w.push(id); this.setWish(w); return w.includes(id); }
};

/* ---------------- Search engine ---------------- */
function searchProducts(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const terms = q.split(/\s+/);
  return PRODUCTS.map(p=>{
    const hay = {
      name: p.name.toLowerCase(),
      cat: (p.category + " " + (CATEGORY_LABELS[p.group]||p.group)).toLowerCase(),
      rest: (p.material + " " + p.color + " " + p.desc).toLowerCase()
    };
    let score = 0, all = true;
    terms.forEach(t=>{
      let s = 0;
      if(hay.name.startsWith(t)) s += 12;
      else if(hay.name.includes(t)) s += 8;
      if(hay.cat.includes(t)) s += 5;
      if(hay.rest.includes(t)) s += 2;
      if(s === 0) all = false;
      score += s;
    });
    return { p, score: all ? score : 0 };
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score || b.p.rating-a.p.rating).map(r=>r.p);
}

function sortList(list, sort){
  const out = list.slice();
  if(sort==="price-low") out.sort((a,b)=>a.price-b.price);
  else if(sort==="price-high") out.sort((a,b)=>b.price-a.price);
  else if(sort==="rating") out.sort((a,b)=>b.rating-a.rating);
  else if(sort==="newest") out.reverse();
  return out;
}

function afterSearch(params){
  const q = params.q || "";
  const form = document.getElementById("pageSearchForm");
  const input = document.getElementById("pageSearchInput");
  const sortSel = document.getElementById("searchSort");
  const facets = document.getElementById("searchFacets");
  const output = document.getElementById("searchOutput");
  const count = document.getElementById("resultCount");
  let group = params.cat || "all";
  if(params.sort) sortSel.value = params.sort;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);

  function base(){ return searchProducts(input.value); }

  function draw(){
    const results = base();
    if(!input.value.trim()){
      count.textContent = "";
      facets.innerHTML = "";
      output.innerHTML = `
        <div class="empty-state">
          <h3>Start with a word or two</h3>
          <p>Search by product name, room, material or colour. Everything stays on this page — results appear right below.</p>
          <a href="#/shop" class="btn btn-secondary">Browse all furniture</a>
        </div>
        <div class="section-head" style="margin-top:48px;"><h2>Most loved right now</h2></div>
        <div class="product-grid">${sortList(PRODUCTS,"rating").slice(0,8).map(productCardHTML).join("")}</div>`;
      return;
    }
    if(results.length === 0){
      count.textContent = "";
      facets.innerHTML = "";
      output.innerHTML = `
        <div class="empty-state">
          <h3>No matches for “${escapeHtml(input.value.trim())}”</h3>
          <p>Check the spelling, use a shorter word, or search by room — like “office”, “bedroom” or “outdoor”.</p>
          <a href="#/shop" class="btn btn-primary">Browse all furniture</a>
        </div>`;
      return;
    }
    const groups = [...new Set(results.map(p=>p.group))];
    facets.innerHTML = `<span>Rooms:</span>` +
      `<button class="chip ${group==='all'?'on':''}" data-facet="all">All (${results.length})</button>` +
      groups.map(g=>{
        const n = results.filter(p=>p.group===g).length;
        return `<button class="chip ${group===g?'on':''}" data-facet="${g}">${CATEGORY_LABELS[g]||g} (${n})</button>`;
      }).join("");

    const filtered = group==="all" ? results : results.filter(p=>p.group===group);
    const shown = sortList(filtered, sortSel.value);
    count.textContent = `${shown.length} ${shown.length===1?"result":"results"} for “${input.value.trim()}”`;
    output.innerHTML = `<div class="product-grid">${shown.map(productCardHTML).join("")}</div>`;
    groupStagger(); setupReveals();
  }

  function pushHash(){
    const v = input.value.trim();
    const parts = [];
    if(v) parts.push("q="+encodeURIComponent(v));
    if(group!=="all") parts.push("cat="+group);
    if(sortSel.value!=="relevance") parts.push("sort="+sortSel.value);
    history.replaceState(null,"", "#/search" + (parts.length? "?"+parts.join("&") : ""));
  }

  let t;
  input.addEventListener("input", ()=>{
    clearTimeout(t);
    t = setTimeout(()=>{ group="all"; draw(); pushHash(); }, 160);
  });
  form.addEventListener("submit", e=>{ e.preventDefault(); clearTimeout(t); draw(); pushHash(); });
  sortSel.addEventListener("change", ()=>{ draw(); pushHash(); });
  facets.addEventListener("click", e=>{
    const b = e.target.closest("[data-facet]");
    if(!b) return;
    group = b.dataset.facet; draw(); pushHash();
  });
  document.querySelectorAll("[data-suggest]").forEach(b=>{
    b.addEventListener("click", ()=>{ input.value = b.dataset.suggest; group="all"; draw(); pushHash(); });
  });

  if(q) input.value = q;
  draw();
}

function afterShop(params){
  const out = document.getElementById("shopOutput");
  const count = document.getElementById("shopCount");
  const sortSel = document.getElementById("shopSort");
  if(params.sort) sortSel.value = params.sort;

  function getCat(){
    const m = document.querySelector("input[name=catM]:checked");
    return m ? m.value : document.querySelector("input[name=cat]:checked").value;
  }
  function apply(){
    const cat = getCat();
    const min = parseInt(document.getElementById("minPrice").value || document.getElementById("minPriceM").value, 10);
    const max = parseInt(document.getElementById("maxPrice").value || document.getElementById("maxPriceM").value, 10);
    const rate = document.getElementById("rate45").checked || document.getElementById("rate45M").checked;
    let list = PRODUCTS.filter(p=>
      (!cat || p.group===cat) &&
      (isNaN(min) || p.price>=min) &&
      (isNaN(max) || p.price<=max) &&
      (!rate || p.rating>=4.5)
    );
    list = sortList(list, sortSel.value);
    count.textContent = `${list.length} ${list.length===1?"piece":"pieces"}`;
    document.getElementById("shopTitle").textContent = cat ? CATEGORY_LABELS[cat] : "All furniture";
    out.innerHTML = list.length
      ? `<div class="product-grid">${list.map(productCardHTML).join("")}</div>`
      : `<div class="empty-state"><h3>Nothing matches these filters</h3><p>Widen the price range or pick another room.</p><button class="btn btn-primary" id="resetInline">Clear filters</button></div>`;
    groupStagger(); setupReveals();
    const ri = document.getElementById("resetInline");
    if(ri) ri.addEventListener("click", reset);
    history.replaceState(null,"", "#/shop" + (cat? "?cat="+cat : ""));
  }
  function reset(){
    document.querySelector("input[name=cat][value='']").checked = true;
    document.querySelector("input[name=catM][value='']").checked = true;
    document.getElementById("minPrice").value = "";
    document.getElementById("maxPrice").value = "";
    document.getElementById("minPriceM").value = "";
    document.getElementById("maxPriceM").value = "";
    document.getElementById("rate45").checked = false;
    document.getElementById("rate45M").checked = false;
    sortSel.value = "featured";
    apply();
  }
  document.querySelectorAll(".filters input").forEach(el=>el.addEventListener("input", apply));
  sortSel.addEventListener("change", apply);
  document.getElementById("clearFilters").addEventListener("click", reset);

  /* ---- Mobile dropdown filter bar ---- */
  const bar = document.getElementById("filterBar");
  const backdrop = document.getElementById("filterBarBackdrop");
  function positionDrop(item){
    const btn = item.querySelector("[data-drop]");
    const drop = item.querySelector(".filter-drop");
    const r = btn.getBoundingClientRect();
    const vw = window.innerWidth;
    let left = r.left;
    const maxLeft = vw - drop.offsetWidth - 12;
    if(left > maxLeft) left = Math.max(12, maxLeft);
    drop.style.top = (r.bottom + 8) + "px";
    drop.style.left = left + "px";
  }
  function closeAllDrops(){
    bar.querySelectorAll(".filter-bar-item.open").forEach(i=>i.classList.remove("open"));
    backdrop.classList.remove("show");
  }
  bar.querySelectorAll("[data-drop]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const item = btn.closest(".filter-bar-item");
      const wasOpen = item.classList.contains("open");
      closeAllDrops();
      if(!wasOpen){
        item.classList.add("open");
        backdrop.classList.add("show");
        positionDrop(item);
      }
    });
  });
  window.addEventListener("resize", ()=>{
    const openItem = bar.querySelector(".filter-bar-item.open");
    if(openItem) positionDrop(openItem);
  });
  window.addEventListener("scroll", ()=>{
    const openItem = bar.querySelector(".filter-bar-item.open");
    if(openItem) closeAllDrops();
  }, { passive:true });
  backdrop.addEventListener("click", closeAllDrops);
  bar.querySelectorAll("input[name=catM]").forEach(el=>el.addEventListener("change", ()=>{ apply(); closeAllDrops(); }));
  bar.querySelectorAll("#rate45M").forEach(el=>el.addEventListener("change", apply));
  bar.querySelector("[data-apply=price]").addEventListener("click", ()=>{ apply(); closeAllDrops(); });
  document.getElementById("clearFiltersM").addEventListener("click", ()=>{ reset(); closeAllDrops(); });

  apply();
}

function afterCart(){

    const ship = sub >= 25000 ? 0 : 1499;
    area.innerHTML = `

            const p = findProduct(id); if(!p) return "";

        <div class="info-line"><strong>Workshop</strong><span>Plot 14, Jubilee Hills, Hyderabad 500033</span></div>
        <div class="info-line"><strong>Phone</strong><span>+91 40 4000 1234</span></div>
        <div class="info-line"><strong>Email</strong><span>hello@prabot.example</span></div>
        <div class="info-line"><strong>Hours</strong><span>Mon–Sat, 10am to 7pm</span></div>
        <div class="about-img" style="margin-top:22px;"><img src="${IMG.collectionLiving}" ${fb("sofas")} alt="Showroom floor" loading="lazy"></div>
      </div>
    </div>
  </section>`;
}
function afterContact(){
  document.getElementById("contactForm").addEventListener("submit", e=>{
    e.preventDefault(); e.target.reset(); showToast("Message sent");
  });
}

function notFound(){
  return `<section class="section"><div class="container"><div class="empty-state">
    <h3>That page does not exist</h3><p>The link may be old or mistyped. Search the catalogue or head back home.</p>
    <a href="#/search" class="btn btn-primary">Search</a></div></div></section>`;
}


/* ---------------- Motion helpers ---------------- */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let revealObserver;
function setupReveals(){
  if(reduceMotion) return;
  if(revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach((en,i)=>{
      if(en.isIntersecting){
        const el = en.target;
        el.style.transitionDelay = Math.min(parseInt(el.dataset.i||0,10)*55, 280) + "ms";
        el.classList.add("in");
        revealObserver.unobserve(el);
      }
    });
  }, { rootMargin:"0px 0px -60px 0px", threshold:.08 });
  document.querySelectorAll("#app .section-head, #app .product-card, #app .collection-card, #app .cat-card, #app .value-card, #app .promo, #app .about-grid > *, #app .filters, #app .empty-state").forEach(el=>{
    if(el.classList.contains("in")) return;
    el.classList.add("reveal");
    revealObserver.observe(el);
  });
}
function groupStagger(){
  document.querySelectorAll("#app .product-grid, #app .grid-collections, #app .cat-rail, #app .value-grid").forEach(grid=>{
    [...grid.children].forEach((c,i)=>{ c.dataset.i = i % 8; });
  });
}
window.addEventListener("scroll", ()=>{
  const h = document.querySelector(".site-header");
  if(h) h.classList.toggle("scrolled", window.scrollY > 8);
}, { passive:true });

/* ---------------- Router ---------------- */
function parseHash(){
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const params = {};
  new URLSearchParams(qs||"").forEach((v,k)=>params[k]=v);
  return { route: parts[0] || "home", id: parts[1] || "", params };
}

function render(){
  document.body.classList.remove("nav-locked");
  const { route, id, params } = parseHash();
  const app = document.getElementById("app");
  let active = route, html = "", after = null;

  switch(route){
    case "home": html = viewHome(); after = afterHome; break;
    case "shop":
      html = viewShop(params); after = ()=>afterShop(params);
      active = params.cat === "office" ? "office" : params.cat === "gaming" ? "gaming" : "shop";
      break;
    case "search": html = viewSearch(params); after = ()=>afterSearch(params); break;
    case "product": html = viewProduct(id); after = ()=>afterProduct(id); break;
    case "cart": html = viewCart(); after = afterCart; break;
    case "wishlist": html = viewWishlist(); break;
    case "about": html = viewAbout(); break;
    case "contact": html = viewContact(); after = afterContact; break;
    default: html = notFound();
  }

  renderHeader(active, route==="search" ? (params.q||"") : "");
  app.innerHTML = html;
  if(after) after();
  renderFooter();
  groupStagger();
  setupReveals();
  window.scrollTo(0,0);
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
