<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRABOT. — Furniture for modern homes and workspaces</title>
<meta name="description" content="Premium sofas, office furniture, beds, dining and gaming setups. Built for everyday comfort and lasting quality.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16241E;
  --ink-soft:#4B5A52;
  --stone:#ECEAE3;
  --stone-deep:#DFDCD2;
  --paper:#FFFFFF;
  --line:#D8D4C8;
  --brass:#9A742C;
  --sage:#5E7263;
  --radius:2px;
  --radius-lg:2px;
  --max-w:1240px;
  --header-h:76px;
  --shadow:0 10px 30px rgba(22,36,30,.08);
  --serif:'Fraunces',Georgia,serif;
  --sans:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;}
body{
  margin:0;background:var(--stone);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
ul{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4,p{margin:0;}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;line-height:1.12;}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

.container{width:100%;max-width:var(--max-w);margin:0 auto;
  padding-left:max(24px,env(safe-area-inset-left));
  padding-right:max(24px,env(safe-area-inset-right));}
.section{padding:44px 0;}
.section-tight{padding-top:0;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px;}
.section-head h2{font-size:30px;}
.section-sub{color:var(--ink-soft);font-size:14px;margin-top:6px;max-width:58ch;}
.view-all{font-size:13px;font-weight:600;border-bottom:1px solid var(--ink);padding-bottom:2px;white-space:nowrap;}
.page-head{background:var(--paper);border-bottom:1px solid var(--line);padding:26px 0 22px;}
.page-title{font-size:30px;margin-top:6px!important;}
.page-desc{color:var(--ink-soft);font-size:14px;margin-top:6px;max-width:62ch;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;
  border-radius:var(--radius);font-size:13px;font-weight:700;letter-spacing:.01em;
  border:1px solid transparent;transition:background .18s,color .18s,border-color .18s;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#0D1712;}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--ink);}
.btn-secondary:hover{background:var(--ink);color:#fff;}
.btn-ghost{background:var(--paper);border-color:var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:9px 15px;font-size:12px;}
.btn:active{transform:translateY(1px);}

/* Header */
body{padding-top:var(--header-h);}
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:90;
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid rgba(216,212,200,.7);
  transition:background .3s,backdrop-filter .3s,box-shadow .25s,border-color .3s;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .site-header{background:rgba(255,255,255,.95);}
}
.site-header.scrolled{
  background:rgba(255,255,255,.74);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);
}
.header-search input,.mobile-search input{
  background:rgba(236,234,227,.66);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-color:rgba(216,212,200,.9);
}
.header-search input:focus,.mobile-search input:focus{background:rgba(255,255,255,.95);}
.icon-btn:hover{background:rgba(22,36,30,.07);}
.header-inner{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:22px;}
.logo{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.02em;flex-shrink:0;}
.main-nav{display:flex;gap:22px;flex-shrink:0;}
.main-nav a{font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:4px 0;border-bottom:1.5px solid transparent;}
.main-nav a:hover{color:var(--ink);}
.main-nav a.active{color:var(--ink);border-bottom-color:var(--brass);}
.header-search{flex:1;max-width:420px;margin-left:auto;position:relative;}
.header-search input{
  width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--stone);}
.header-search input:focus{outline:none;border-color:var(--ink);background:#fff;}
.header-search .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft);pointer-events:none;}
.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto;}
.icon-group{display:flex;align-items:center;gap:2px;background:rgba(22,36,30,.05);border-radius:100px;padding:3px;}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;background:none;border:none;color:var(--ink);border-radius:var(--radius);}
.icon-btn:hover{background:var(--stone);}
.icon-btn svg{width:20px;height:20px;}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--brass);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;}
.menu-toggle{display:none;}
.mobile-search{display:none;padding:0 24px 12px;}

/* Hero */
.hero{background:var(--paper);border-bottom:1px solid var(--line);}
.hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:52px;align-items:center;padding:70px 24px 74px;}
.hero h1{font-size:clamp(34px,4.6vw,58px);}
.hero .kicker{font-family:var(--serif);font-size:14px;color:var(--brass);margin-bottom:18px;}
.hero p.lead{color:var(--ink-soft);margin-top:20px;max-width:46ch;}
.hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;}
.hero-image{border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.hero-image img{aspect-ratio:4/3;object-fit:cover;width:100%;}
.hero-marks{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap;}
.hero-marks div{font-size:12.5px;color:var(--ink-soft);}
.hero-marks strong{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:600;}

/* Category rail */
.cat-rail{display:grid;grid-template-columns:repeat(9,1fr);gap:14px;}
.cat-card{text-align:center;}
.cat-card .cat-img{border-radius:50%;overflow:hidden;aspect-ratio:1;border:1px solid var(--line);background:#fff;}
.cat-card img{width:100%;height:100%;object-fit:cover;}
.cat-card:hover .cat-img{border-color:var(--ink);}
.cat-name{font-size:12.5px;font-weight:600;margin-top:10px;}

/* Collections */
.grid-collections{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.collection-card{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:#000;}
.collection-card img{aspect-ratio:4/3;object-fit:cover;width:100%;opacity:.86;transition:opacity .25s,transform .4s;}
.collection-card:hover img{opacity:.7;transform:scale(1.03);}
.collection-card .overlay{position:absolute;left:0;right:0;bottom:0;padding:20px;color:#fff;
  background:linear-gradient(to top,rgba(10,18,14,.8),transparent);}
.collection-card .cname{font-size:12px;font-weight:700;color:#E2CFA3;}
.collection-card .ctitle{font-family:var(--serif);font-size:19px;margin-top:4px;line-height:1.2;}

/* Product cards */
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.product-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;}
.product-card:hover{border-color:var(--ink);}
.pc-media{position:relative;background:var(--stone-deep);}
.pc-media img{aspect-ratio:1;object-fit:cover;width:100%;}
.pc-wish{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);}
.pc-wish svg{width:16px;height:16px;}
.pc-wish.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.pc-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.pc-cat{font-size:11.5px;color:var(--ink-soft);}
.pc-name{font-size:14.5px;font-weight:600;line-height:1.35;}
.pc-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px;}
.pc-price{font-family:var(--serif);font-size:17px;font-weight:600;}
.pc-rating{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;}
.pc-rating svg{width:13px;height:13px;color:var(--brass);}
.pc-actions{margin-top:10px;}

/* Search page */
.search-hero{background:var(--paper);border-bottom:1px solid var(--line);padding:44px 0 34px;}
.search-form{display:flex;gap:10px;margin-top:20px;max-width:640px;}
.search-form input{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--stone);}
.search-form input:focus{outline:none;border-color:var(--ink);background:#fff;}
.suggest-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center;}
.suggest-row span{font-size:12.5px;color:var(--ink-soft);}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:600;}
.chip:hover{border-color:var(--ink);}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.result-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.filter-bar{display:none;}
.filter-drop{display:none;}
.filter-bar-backdrop{display:none;}
.result-count{font-size:13.5px;color:var(--ink-soft);}
.empty-state{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:56px 28px;text-align:center;}
.empty-state h3{font-size:22px;}
.empty-state p{color:var(--ink-soft);margin:10px auto 20px;max-width:46ch;}

/* Filters */
.shop-layout{display:grid;grid-template-columns:238px 1fr;gap:34px;align-items:start;}
.filters{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;position:sticky;top:calc(var(--header-h) + 18px);}
.filter-block{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line);}
.filter-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.filter-block h4{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:10px;}
.filter-block label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);padding:3px 0;cursor:pointer;}
.filter-block label:hover{color:var(--ink);}
.filter-block input[type=checkbox]{accent-color:var(--ink);width:15px;height:15px;}
select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);}
.range-row{display:flex;gap:8px;}
.range-row input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);}

/* Product detail */
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:46px;align-items:start;}
.pdp-media{border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);background:#fff;}
.pdp-media img{aspect-ratio:1;object-fit:cover;width:100%;}
.pdp h1{font-size:32px;margin:8px 0 12px;}
.pdp .price{font-family:var(--serif);font-size:28px;font-weight:600;margin:14px 0;}
.spec-table{width:100%;border-collapse:collapse;margin-top:22px;font-size:13.5px;}
.spec-table td{padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink-soft);}
.spec-table td:first-child{width:40%;color:var(--ink);font-weight:600;}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;}
.qty button{width:38px;height:42px;background:none;border:none;font-size:17px;color:var(--ink);}
.qty button:hover{background:var(--stone);}
.qty span{min-width:38px;text-align:center;font-weight:700;font-size:14px;}
.pdp-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.breadcrumb{font-size:12.5px;color:var(--ink-soft);}
.breadcrumb a:hover{color:var(--ink);text-decoration:underline;}

/* Cart & wishlist pages */
.cart-layout{display:grid;grid-template-columns:1fr 340px;gap:30px;align-items:start;}
.cart-list{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;}
.cart-row{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:18px;border-bottom:1px solid var(--line);align-items:center;}
.cart-row:last-child{border-bottom:none;}
.cart-row img{width:96px;height:96px;object-fit:cover;border-radius:var(--radius);}
.cart-row .nm{font-weight:600;font-size:14.5px;}
.cart-row .ct{font-size:12.5px;color:var(--ink-soft);}
.cart-row .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.link-btn{background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;padding:0;}
.link-btn:hover{color:var(--ink);}
.summary{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;position:sticky;top:calc(var(--header-h) + 18px);}
.summary h3{font-size:19px;margin-bottom:16px;}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);padding:7px 0;}
.sum-total{display:flex;justify-content:space-between;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);
  border-top:1px solid var(--line);margin-top:10px;padding-top:14px;}

/* About / contact */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:46px;align-items:center;}
.about-img{border-radius:var(--radius-lg);overflow:hidden;}
.about-img img{aspect-ratio:4/3;object-fit:cover;width:100%;}
.about-copy h2{font-size:30px;margin-bottom:14px;}
.about-copy p{color:var(--ink-soft);}
.stat-row{display:flex;gap:34px;margin-top:26px;flex-wrap:wrap;}
.stat .num{font-family:var(--serif);font-size:27px;font-weight:600;}
.stat .lbl{font-size:12.5px;color:var(--ink-soft);}
.value-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.value-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;}
.value-card h3{font-size:18px;margin-bottom:8px;}
.value-card p{font-size:13.5px;color:var(--ink-soft);}
.contact-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:38px;align-items:start;}
.form-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;}
.admin-table-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);}
.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.admin-table th,.admin-table td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
.admin-table th{color:var(--ink-soft);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
.admin-table tr:last-child td{border-bottom:none;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--stone);}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink);background:#fff;}
.field textarea{min-height:120px;resize:vertical;}
.info-line{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.info-line strong{min-width:84px;}

/* Promo */
.promo{position:relative;border-radius:var(--radius-lg);overflow:hidden;}
.promo img{width:100%;height:340px;object-fit:cover;}
.promo .promo-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;
  padding:0 56px;color:#fff;background:linear-gradient(to right,rgba(12,22,17,.82),rgba(12,22,17,.15));}
.promo h2{font-size:32px;max-width:16ch;}
.promo p{max-width:42ch;color:#E6E3D8;}
.promo .btn-primary{background:#fff;color:var(--ink);align-self:flex-start;}
.promo .btn-primary:hover{background:#E2CFA3;}

/* Footer */
.site-footer{background:var(--ink);color:#DCE0DB;margin-top:20px;}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.3fr;gap:36px;padding:56px 24px 40px;}
.site-footer .logo{color:#fff;}
.site-footer p{font-size:13.5px;color:#A9B5AC;margin-top:12px;max-width:34ch;}
.site-footer h4{font-family:var(--serif);font-size:15px;color:#fff;margin-bottom:12px;font-weight:600;}
.site-footer li{padding:5px 0;font-size:13.5px;color:#A9B5AC;}
.site-footer li a:hover{color:#fff;}
.news-row{display:flex;gap:8px;margin-top:12px;}
.news-row input{flex:1;padding:11px 12px;border:1px solid #33463C;background:#0F1A15;color:#fff;border-radius:var(--radius);}
.news-row input::placeholder{color:#7E8C83;}
.news-row .btn{background:#E2CFA3;color:var(--ink);}
.footer-base{border-top:1px solid #29382F;padding:18px 24px;display:flex;justify-content:space-between;gap:14px;font-size:12.5px;color:#8C9A91;flex-wrap:wrap;}

/* Toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:100px;font-size:13px;font-weight:600;z-index:200;
  transition:opacity .2s,transform .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}


/* ---- Image loading + placeholders ---- */
.img-wrap{position:relative;background:var(--stone-deep);overflow:hidden;}
img.lazy-img{opacity:0;transition:opacity .45s ease;}
img.lazy-img.loaded{opacity:1;}
.shimmer::after{content:none;}

/* ---- Entrance motion ---- */
.reveal{opacity:0;transform:translateY(14px);}
.reveal.in{opacity:1;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1);}
.hero-copy-anim > *{opacity:0;transform:translateY(16px);animation:riseIn .7s cubic-bezier(.2,.7,.3,1) forwards;}
.hero-copy-anim > *:nth-child(1){animation-delay:.05s;}
.hero-copy-anim > *:nth-child(2){animation-delay:.14s;}
.hero-copy-anim > *:nth-child(3){animation-delay:.23s;}
.hero-copy-anim > *:nth-child(4){animation-delay:.32s;}
.hero-copy-anim > *:nth-child(5){animation-delay:.41s;}
.hero .hero-image{animation:heroImg .9s cubic-bezier(.2,.7,.3,1) both;}
@keyframes riseIn{to{opacity:1;transform:none;}}
@keyframes heroImg{from{opacity:0;transform:scale(1.04);}to{opacity:1;transform:none;}}

/* ---- Interaction motion ---- */
.product-card{transition:none;border-color:var(--line)!important;box-shadow:none!important;}
.product-card:focus,.product-card:focus-within,.pc-media img:focus{outline:none;}
.pc-media{border:none;}
.pc-wish{transition:transform .18s,background .18s,color .18s;}
.pc-wish:active{transform:scale(.88);}
.pc-wish.pop{animation:pop .35s ease;}
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.25);}100%{transform:scale(1);}}
.cat-card .cat-img{transition:transform .3s cubic-bezier(.2,.7,.3,1),border-color .2s;}
.cat-card:hover .cat-img{transform:translateY(-3px);}
.chip{transition:background .18s,color .18s,border-color .18s,transform .18s;}
.chip:active{transform:scale(.96);}
.view-all{transition:opacity .2s;}
.site-header{transition:box-shadow .25s;}
.site-header.scrolled{box-shadow:0 8px 28px rgba(22,36,30,.10);}
.badge{animation:pop .35s ease;}
.cart-row{animation:riseIn .4s ease both;}
#app{animation:pageIn .35s ease both;}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){
  .reveal,.hero-copy-anim > *,.hero .hero-image,#app,.cart-row{opacity:1!important;transform:none!important;animation:none!important;}
  .shimmer::after{animation:none;}
}

/* Responsive */

/* ================= Mobile fit fixes ================= */

/* 1. Header offset is measured at runtime (--header-total) so the mobile
      search bar can never overlap content. Values below are fallbacks. */
:root{--header-total:var(--header-h);}
body{padding-top:var(--header-total);}

/* 2. iOS Safari zooms the whole page whenever a focused field is under 16px.
      This is the single biggest cause of the "zoomed in" feel on phones. */
@media (max-width:900px){
  body{padding-top:var(--header-total);}
  input,select,textarea,
  .field input,.field textarea,.field select,
  .header-search input,.mobile-search input,
  .search-form input,.range-row input,
  .filter-drop .range-row input{font-size:16px;}
  .search-form input{padding:13px 14px;}
  .header-search input,.mobile-search input{padding:10px 14px 10px 38px;}
  select{font-size:16px;}

  /* nav sheet + backdrop sit under the FULL header, not just its first row */
  .main-nav.open{top:var(--header-total);
    max-height:calc(100dvh - var(--header-total));}
  .nav-backdrop{top:var(--header-total);height:100dvh;}
  .filter-bar-backdrop{top:var(--header-total);}

  /* sticky offsets follow the real header too */
  .filters,.summary{top:calc(var(--header-total) + 18px);}

  /* dropdown panels stay inside the screen, vertically as well */
  .filter-drop{max-width:calc(100vw - 24px);
    max-height:60dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .filter-drop label{white-space:normal;}
  .filter-drop .range-row input{width:100%;min-width:0;}

  /* horizontal rails: hide the scrollbar, let them bleed to the edge cleanly */
  .cat-rail,.grid-collections,.filter-bar{scrollbar-width:none;}
  .cat-rail::-webkit-scrollbar,
  .grid-collections::-webkit-scrollbar,
  .filter-bar::-webkit-scrollbar{display:none;}

  /* nothing wide enough to push the page sideways */
  .spec-table,.cart-row,.summary,.form-card,.product-card{max-width:100%;}
  .pc-name,.cart-row .nm,.page-title,.hero h1,.promo h2,h1,h2,h3{
    overflow-wrap:anywhere;word-break:break-word;}
  .breadcrumb{overflow-wrap:anywhere;}
  img,video,table{max-width:100%;}

  /* comfortable tap targets */
  .icon-btn,.qty button{min-width:44px;min-height:44px;}
  .btn{min-height:44px;}
  .link-btn,.view-all{padding:4px 0;}

  .toast{max-width:calc(100vw - 32px);text-align:center;
    bottom:calc(20px + env(safe-area-inset-bottom));}
}

/* 3. Respect the notch / home indicator */
.site-footer{padding-bottom:env(safe-area-inset-bottom);}
.hero-grid,.footer-grid{
  padding-left:max(24px,env(safe-area-inset-left));
  padding-right:max(24px,env(safe-area-inset-right));}
@media (max-width:900px){
  .hero-grid{padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right));}
  .container{padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right));}
  .mobile-search{padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right));}
}
@media (max-width:640px){
  .footer-grid{padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right));}
}

/* 4. Body scroll lock that doesn't jump the page on iOS */
body.nav-locked{position:relative;overflow:hidden;touch-action:none;}

/* ---------------- Admin data layer ----------------
   Base PRODUCTS / BASE_CATEGORY_LABELS above are the built-in catalogue (read-only, ship with the site).
   Admin-created/edited products and categories live in localStorage and are merged in at read time,
   so the rest of the app (shop, search, home, product page) never needs to know the difference. */
const AdminStore = {
  prodKey: "prabot_admin_products",   // { [id]: productObject }  -- add or override
  delKey: "prabot_admin_deleted",     // [ id, id, ... ]          -- ids of base products hidden by admin
  catKey: "prabot_admin_categories",  // { [id]: {id,name,group} } -- admin-created/edited categories (group is fixed, never editable)
  catDelKey: "prabot_admin_cat_deleted", // [ id, id, ... ]        -- ids of base categories hidden by admin
  pinKey: "prabot_admin_pin",
  sessKey: "prabot_admin_session",
  homeKey: "prabot_admin_home",   // { hero:{...}, about:{...}, promo:{...}, collections:[...] } -- overrides merged onto defaults
  orderKey: "prabot_orders",      // [ orderObject, ... ] -- customer orders placed via checkout
  settingsKey: "prabot_admin_settings", // { siteName, phone, email, address, freeShipThreshold, shipCost, currency }

  read(k, fallback){ try{ const v = JSON.parse(localStorage.getItem(k)); return v==null?fallback:v; }catch(e){ return fallback; } },
  write(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },

  getOverrides(){ return this.read(this.prodKey, {}); },
  getDeleted(){ return this.read(this.delKey, []); },
  getCatOverrides(){ return this.read(this.catKey, {}); },
  getCatDeleted(){ return this.read(this.catDelKey, []); },

  /* ---- Orders ---- */
  getOrders(){ return this.read(this.orderKey, []); },
  saveOrders(list){ this.write(this.orderKey, list); },
  addOrder(order){ const list = this.getOrders(); list.unshift(order); this.saveOrders(list); return order; },
  nextOrderId(){
    const list = this.getOrders();
    let n = list.length + 1;
    const exists = id => list.some(o=>o.id===id);
    while(exists("ORD"+String(n).padStart(4,"0"))) n++;
    return "ORD"+String(n).padStart(4,"0");
  },
  updateOrderStatus(id, status){
    const list = this.getOrders();
    const o = list.find(o=>o.id===id);
    if(o){ o.status = status; o.history = (o.history||[]).concat([{status, at: new Date().toISOString()}]); this.saveOrders(list); }
  },
  deleteOrder(id){ this.saveOrders(this.getOrders().filter(o=>o.id!==id)); },

  /* ---- Site settings ---- */
  defaultSettings(){
    return {
      siteName: "Prabot Furniture",
      phone: "+91 90000 00000",
      email: "hello@prabot.example",
      address: "Hyderabad, Telangana",
      freeShipThreshold: 25000,
      shipCost: 1499,
      currency: "INR"
    };
  },
  getSettings(){ return Object.assign({}, this.defaultSettings(), this.read(this.settingsKey, {})); },
  saveSettings(partial){ this.write(this.settingsKey, Object.assign({}, this.getSettings(), partial)); },

  /* ---- Homepage content ---- */
  getHome(){ return this.read(this.homeKey, {}); },
  saveHome(partial){
    const cur = this.getHome();
    this.write(this.homeKey, Object.assign({}, cur, partial));
  },

  upsertProduct(p){
    const o = this.getOverrides(); o[p.id] = p; this.write(this.prodKey, o);
  },
  deleteProduct(id){
    const o = this.getOverrides(); delete o[id]; this.write(this.prodKey, o);
    const d = this.getDeleted(); if(!d.includes(id)){ d.push(id); this.write(this.delKey, d); }
  },
  restoreProduct(id){
    const d = this.getDeleted().filter(x=>x!==id); this.write(this.delKey, d);
  },
  nextId(){
    const all = allProducts();
    let n = all.length + 1;
    while(all.some(p=>p.id === "p"+String(n).padStart(2,"0"))) n++;
    return "p"+String(n).padStart(2,"0");
  },

  /* Category = { id, name, group }. group must be one of FIXED_GROUPS and can't be changed via this API's caller
     (the UI never offers a way to edit group on an existing category). */
  upsertCategory(cat){
    const c = this.getCatOverrides(); c[cat.id] = cat; this.write(this.catKey, c);
  },
  deleteCategory(id){
    const c = this.getCatOverrides(); delete c[id]; this.write(this.catKey, c);
    const d = this.getCatDeleted(); if(!d.includes(id)){ d.push(id); this.write(this.catDelKey, d); }
  },
  nextCategoryId(group){
    const all = allCategories();
    let n = 1;
    while(all.some(c=>c.id === group+"-c"+n)) n++;
    return group+"-c"+n;
  },

  /* ---- PIN / session ---- */
  hasPin(){ return !!this.read(this.pinKey, null); },
  setPin(pin){ this.write(this.pinKey, String(pin)); },
  checkPin(pin){ return this.read(this.pinKey, null) === String(pin); },
  isLoggedIn(){ return this.read(this.sessKey, false) === true; },
  login(){ this.write(this.sessKey, true); },
  logout(){ this.write(this.sessKey, false); }
};

function allProducts(){
  const overrides = AdminStore.getOverrides();
  const deleted = new Set(AdminStore.getDeleted());
  const merged = PRODUCTS.filter(p=>!deleted.has(p.id)).map(p=> overrides[p.id] ? overrides[p.id] : p);
  // add admin-created products not present in base list
  Object.keys(overrides).forEach(id=>{
    if(!PRODUCTS.some(p=>p.id===id)) merged.push(overrides[id]);
  });
  return merged;
}
function allCategoryLabels(){
  return Object.assign({}, BASE_CATEGORY_LABELS);
}

/* All product categories (e.g. "Office Chair"), merging admin-created/edited ones over the base list.
   Groups themselves (office, gaming, ...) are fixed — see FIXED_GROUPS — and never editable here. */
function allCategories(){
  const overrides = AdminStore.getCatOverrides();
  const deleted = new Set(AdminStore.getCatDeleted());
  const merged = BASE_CATEGORIES.filter(c=>!deleted.has(c.id)).map(c=> overrides[c.id] ? overrides[c.id] : c);
  Object.keys(overrides).forEach(id=>{
    if(!BASE_CATEGORIES.some(c=>c.id===id)) merged.push(overrides[id]);
  });
  return merged;
}
function categoriesByGroup(group){
  return allCategories().filter(c=>c.group===group);
}

  read(k){ try{ return JSON.parse(localStorage.getItem(k)) || (k===this.cartKey?{}:[]); }catch(e){ return k===this.cartKey?{}:[]; } },
  write(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  getCart(){ return this.read(this.cartKey); },
  setCart(c){ this.write(this.cartKey,c); syncBadges(); },
  addToCart(id,qty){ const c=this.getCart(); c[id]=(c[id]||0)+(qty||1); this.setCart(c); },
  setQty(id,q){ const c=this.getCart(); if(q<=0) delete c[id]; else c[id]=q; this.setCart(c); },
  removeFromCart(id){ const c=this.getCart(); delete c[id]; this.setCart(c); },
  cartCount(){ return Object.values(this.getCart()).reduce((a,b)=>a+b,0); },
  cartTotal(){ return Object.entries(this.getCart()).reduce((sum,[id,q])=>{ const p=findProduct(id); return sum + (p? p.price*q : 0); },0); },
  getWish(){ return this.read(this.wishKey); },
  setWish(w){ this.write(this.wishKey,w); syncBadges(); },
  inWish(id){ return this.getWish().includes(id); },
  toggleWish(id){ const w=this.getWish(); const i=w.indexOf(id); if(i>-1) w.splice(i,1); else w.push(id); this.setWish(w); return w.includes(id); }
};

/* ---------------- Search engine ---------------- */
function searchProducts(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const terms = q.split(/\s+/);
  return allProducts().map(p=>{
    const hay = {
      name: p.name.toLowerCase(),
      cat: (p.category + " " + (allCategoryLabels()[p.group]||p.group)).toLowerCase(),
      rest: (p.material + " " + p.color + " " + p.desc).toLowerCase()
    };
    let score = 0, all = true;
    terms.forEach(t=>{
      let s = 0;
      if(hay.name.startsWith(t)) s += 12;
      else if(hay.name.includes(t)) s += 8;
      if(hay.cat.includes(t)) s += 5;
      if(hay.rest.includes(t)) s += 2;
      if(s === 0) all = false;
      score += s;
    });
    return { p, score: all ? score : 0 };
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score || b.p.rating-a.p.rating).map(r=>r.p);
}

function sortList(list, sort){
  const out = list.slice();
  if(sort==="price-low") out.sort((a,b)=>a.price-b.price);
  else if(sort==="price-high") out.sort((a,b)=>b.price-a.price);
  else if(sort==="rating") out.sort((a,b)=>b.rating-a.rating);
  else if(sort==="newest") out.reverse();
  return out;
}

function afterSearch(params){
  const q = params.q || "";
  const form = document.getElementById("pageSearchForm");
  const input = document.getElementById("pageSearchInput");
  const sortSel = document.getElementById("searchSort");
  const facets = document.getElementById("searchFacets");
  const output = document.getElementById("searchOutput");
  const count = document.getElementById("resultCount");
  let group = params.cat || "all";
  if(params.sort) sortSel.value = params.sort;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);

  function base(){ return searchProducts(input.value); }

  function draw(){
    const results = base();
    if(!input.value.trim()){
      count.textContent = "";
      facets.innerHTML = "";
      output.innerHTML = `
        <div class="empty-state">
          <h3>Start with a word or two</h3>
          <p>Search by product name, room, material or colour. Everything stays on this page — results appear right below.</p>
          <a href="#/shop" class="btn btn-secondary">Browse all furniture</a>
        </div>
        <div class="section-head" style="margin-top:48px;"><h2>Most loved right now</h2></div>
        <div class="product-grid">${sortList(allProducts(),"rating").slice(0,8).map(productCardHTML).join("")}</div>`;
      return;
    }
    if(results.length === 0){
      count.textContent = "";
      facets.innerHTML = "";
      output.innerHTML = `
        <div class="empty-state">
          <h3>No matches for “${escapeHtml(input.value.trim())}”</h3>
          <p>Check the spelling, use a shorter word, or search by room — like “office”, “bedroom” or “outdoor”.</p>
          <a href="#/shop" class="btn btn-primary">Browse all furniture</a>
        </div>`;
      return;
    }
    const groups = [...new Set(results.map(p=>p.group))];
    facets.innerHTML = `<span>Rooms:</span>` +
      `<button class="chip ${group==='all'?'on':''}" data-facet="all">All (${results.length})</button>` +
      groups.map(g=>{
        const n = results.filter(p=>p.group===g).length;
        return `<button class="chip ${group===g?'on':''}" data-facet="${g}">${allCategoryLabels()[g]||g} (${n})</button>`;
      }).join("");

    const filtered = group==="all" ? results : results.filter(p=>p.group===group);
    const shown = sortList(filtered, sortSel.value);
    count.textContent = `${shown.length} ${shown.length===1?"result":"results"} for “${input.value.trim()}”`;
    output.innerHTML = `<div class="product-grid">${shown.map(productCardHTML).join("")}</div>`;
    groupStagger(); setupReveals();
  }

  function pushHash(){
    const v = input.value.trim();
    const parts = [];
    if(v) parts.push("q="+encodeURIComponent(v));
    if(group!=="all") parts.push("cat="+group);
    if(sortSel.value!=="relevance") parts.push("sort="+sortSel.value);
    history.replaceState(null,"", "#/search" + (parts.length? "?"+parts.join("&") : ""));
  }

  let t;
  input.addEventListener("input", ()=>{
    clearTimeout(t);
    t = setTimeout(()=>{ group="all"; draw(); pushHash(); }, 160);
  });
  form.addEventListener("submit", e=>{ e.preventDefault(); clearTimeout(t); draw(); pushHash(); });
  sortSel.addEventListener("change", ()=>{ draw(); pushHash(); });
  facets.addEventListener("click", e=>{
    const b = e.target.closest("[data-facet]");
    if(!b) return;
    group = b.dataset.facet; draw(); pushHash();
  });
  document.querySelectorAll("[data-suggest]").forEach(b=>{
    b.addEventListener("click", ()=>{ input.value = b.dataset.suggest; group="all"; draw(); pushHash(); });
  });

  if(q) input.value = q;
  draw();
}

  const d = defaultHomeContent();

function afterShop(params){
  const out = document.getElementById("shopOutput");
  const count = document.getElementById("shopCount");
  const sortSel = document.getElementById("shopSort");
  if(params.sort) sortSel.value = params.sort;

  function getCat(){
    const m = document.querySelector("input[name=catM]:checked");
    return m ? m.value : document.querySelector("input[name=cat]:checked").value;
  }
  function apply(){
    const cat = getCat();
    const min = parseInt(document.getElementById("minPrice").value || document.getElementById("minPriceM").value, 10);
    const max = parseInt(document.getElementById("maxPrice").value || document.getElementById("maxPriceM").value, 10);
    const rate = document.getElementById("rate45").checked || document.getElementById("rate45M").checked;
    let list = allProducts().filter(p=>
      (!cat || p.group===cat) &&
      (isNaN(min) || p.price>=min) &&
      (isNaN(max) || p.price<=max) &&
      (!rate || p.rating>=4.5)
    );
    list = sortList(list, sortSel.value);
    count.textContent = `${list.length} ${list.length===1?"piece":"pieces"}`;
    document.getElementById("shopTitle").textContent = cat ? allCategoryLabels()[cat] : "All furniture";
    out.innerHTML = list.length
      ? `<div class="product-grid">${list.map(productCardHTML).join("")}</div>`
      : `<div class="empty-state"><h3>Nothing matches these filters</h3><p>Widen the price range or pick another room.</p><button class="btn btn-primary" id="resetInline">Clear filters</button></div>`;
    groupStagger(); setupReveals();
    const ri = document.getElementById("resetInline");
    if(ri) ri.addEventListener("click", reset);
    history.replaceState(null,"", "#/shop" + (cat? "?cat="+cat : ""));
  }
  function reset(){
    document.querySelector("input[name=cat][value='']").checked = true;
    document.querySelector("input[name=catM][value='']").checked = true;
    document.getElementById("minPrice").value = "";
    document.getElementById("maxPrice").value = "";
    document.getElementById("minPriceM").value = "";
    document.getElementById("maxPriceM").value = "";
    document.getElementById("rate45").checked = false;
    document.getElementById("rate45M").checked = false;
    sortSel.value = "featured";
    apply();
  }
  document.querySelectorAll(".filters input").forEach(el=>el.addEventListener("input", apply));
  sortSel.addEventListener("change", apply);
  document.getElementById("clearFilters").addEventListener("click", reset);

  /* ---- Mobile dropdown filter bar ---- */
  const bar = document.getElementById("filterBar");
  const backdrop = document.getElementById("filterBarBackdrop");
  function positionDrop(item){
    const btn = item.querySelector("[data-drop]");
    const drop = item.querySelector(".filter-drop");
    const r = btn.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    let left = r.left;
    const maxLeft = vw - drop.offsetWidth - 12;
    if(left > maxLeft) left = Math.max(12, maxLeft);

    // flip above the button if there isn't room below
    let top = r.bottom + 8;
    const h = drop.offsetHeight;
    if(top + h > vh - 12){
      const above = r.top - 8 - h;
      top = above >= 12 ? above : Math.max(12, vh - h - 12);
    }
    drop.style.top = top + "px";
    drop.style.left = left + "px";
  }
  function closeAllDrops(){
    bar.querySelectorAll(".filter-bar-item.open").forEach(i=>i.classList.remove("open"));
    backdrop.classList.remove("show");
  }
  bar.querySelectorAll("[data-drop]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const item = btn.closest(".filter-bar-item");
      const wasOpen = item.classList.contains("open");
      closeAllDrops();
      if(!wasOpen){
        item.classList.add("open");
        backdrop.classList.add("show");
        positionDrop(item);
      }
    });
  });
  window.addEventListener("resize", ()=>{
    const openItem = bar.querySelector(".filter-bar-item.open");
    if(openItem) positionDrop(openItem);
  });
  window.addEventListener("scroll", ()=>{
    const openItem = bar.querySelector(".filter-bar-item.open");
    if(openItem) closeAllDrops();
  }, { passive:true });
  backdrop.addEventListener("click", closeAllDrops);
  bar.querySelectorAll("input[name=catM]").forEach(el=>el.addEventListener("change", ()=>{ apply(); closeAllDrops(); }));
  bar.querySelectorAll("#rate45M").forEach(el=>el.addEventListener("change", apply));
  bar.querySelector("[data-apply=price]").addEventListener("click", ()=>{ apply(); closeAllDrops(); });
  document.getElementById("clearFiltersM").addEventListener("click", ()=>{ reset(); closeAllDrops(); });

  apply();
}

function afterProduct(id){

  document.getElementById("qPlus").addEventListener("click", ()=>{ q = Math.min(20,q+1); val.textContent=q; });
  document.getElementById("pdpAdd").addEventListener("click", ()=>{ Store.addToCart(p.id,q); showToast(`Added ${q} to cart`); });

function afterCart(){
  const area = document.getElementById("cartArea");
  function draw(){
    const cart = Store.getCart();

      area.innerHTML = `<div class="empty-state"><h3>Your cart is empty</h3><p>Add a piece from the catalogue and it will show up here with delivery and total.</p><a href="#/shop" class="btn btn-primary">Browse furniture</a></div>`;
      return;
    }
    const sub = Store.cartTotal();
    const settings = AdminStore.getSettings();
    const ship = sub >= settings.freeShipThreshold ? 0 : settings.shipCost;
    area.innerHTML = `
      <div class="cart-layout">
        <div class="cart-list">
          ${ids.map(id=>{
            const p = findProduct(id); if(!p) return "";
            return `

                </div>
              </div>
              <div class="rt">
                <span class="pc-price">${formatINR(p.price*cart[id])}</span>
                <button class="link-btn" data-del="${p.id}">Remove</button>
              </div>
            </div>`;
          }).join("")}
        </div>
        <aside class="summary">
          <h3>Order summary</h3>
          <div class="sum-row"><span>Subtotal</span><span>${formatINR(sub)}</span></div>
          <div class="sum-row"><span>Delivery and install</span><span>${ship? formatINR(ship) : "Free"}</span></div>
          <div class="sum-total"><span>Total</span><span>${formatINR(sub+ship)}</span></div>
          <a href="#/checkout" class="btn btn-primary btn-block" style="margin-top:18px;" id="checkout">Checkout</a>
          <a href="#/shop" class="btn btn-ghost btn-block" style="margin-top:10px;">Keep shopping</a>
          ${ship? `<p style="font-size:12.5px;color:var(--ink-soft);margin-top:12px;">Add ${formatINR(settings.freeShipThreshold-sub)} more for free delivery.</p>`:""}
        </aside>
      </div>`;
    area.querySelectorAll("[data-inc]").forEach(b=>b.addEventListener("click",()=>{ Store.setQty(b.dataset.inc, Store.getCart()[b.dataset.inc]+1); draw(); }));
    area.querySelectorAll("[data-dec]").forEach(b=>b.addEventListener("click",()=>{ Store.setQty(b.dataset.dec, Store.getCart()[b.dataset.dec]-1); draw(); }));
    area.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{ Store.removeFromCart(b.dataset.del); showToast("Removed"); draw(); }));
  }
  draw();
}

function afterCheckout(){
  const form = document.getElementById("checkoutForm");
  if(!form) return;
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const cart = Store.getCart();
    const ids = Object.keys(cart);
    const items = ids.map(id=>{
      const p = findProduct(id);
      return p ? { id:p.id, name:p.name, price:p.price, qty:cart[id] } : null;
    }).filter(Boolean);
    const settings = AdminStore.getSettings();
    const sub = Store.cartTotal();
    const ship = sub >= settings.freeShipThreshold ? 0 : settings.shipCost;
    const order = {
      id: AdminStore.nextOrderId(),
      createdAt: new Date().toISOString(),
      status: "pending",
      customer: {
        name: document.getElementById("coName").value.trim(),
        phone: document.getElementById("coPhone").value.trim(),
        email: document.getElementById("coEmail").value.trim(),
        address: document.getElementById("coAddress").value.trim(),
        notes: document.getElementById("coNotes").value.trim()
      },
      items, subtotal: sub, shipping: ship, total: sub+ship,
      history: [{status:"pending", at:new Date().toISOString()}]
    };
    AdminStore.addOrder(order);
    Store.setCart({});
    location.hash = "#/order-confirmed/" + order.id;
  });
}

          <div class="field">

            <input id="adminPin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="8" autocomplete="off" required autofocus>
          </div>
          ${firstTime ? `<div class="field"><label for="adminPinConfirm">Confirm PIN</label><input id="adminPinConfirm" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="8" autocomplete="off" required></div>` : ""}
          <p id="adminLoginError" style="color:#B3261E;font-size:13px;display:none;margin-bottom:10px;">Incorrect PIN.</p>

        </form>
      </div>
    </div>
  </section>`;
}
function afterAdminLogin(){
  const form = document.getElementById("adminLoginForm");
  const firstTime = !AdminStore.hasPin();
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const pin = document.getElementById("adminPin").value.trim();
    if(firstTime){
      const confirmPin = document.getElementById("adminPinConfirm").value.trim();
      if(pin.length < 4){ showToast("PIN must be at least 4 digits"); return; }
      if(pin !== confirmPin){ showToast("PINs do not match"); return; }
      AdminStore.setPin(pin);
      AdminStore.login();
      location.hash = "#/admin/panel";
      return;
    }
    if(AdminStore.checkPin(pin)){
      AdminStore.login();
      location.hash = "#/admin/panel";
    } else {
      document.getElementById("adminLoginError").style.display = "block";
      form.reset();
      document.getElementById("adminPin").focus();
    }
  });
}

/* ---------------- Admin: panel ---------------- */
function adminTabBar(active){
  const tabs = [
    {key:"dashboard", label:"Dashboard"},
    {key:"orders", label:"Orders"},
    {key:"products", label:"Products"},
    {key:"categories", label:"Categories"},
    {key:"homepage", label:"Homepage"},
    {key:"settings", label:"Settings"}
  ];
  return `<div class="admin-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;">
    ${tabs.map(t=>`<a href="#/admin/panel?tab=${t.key}" class="btn btn-sm ${active===t.key?'btn-primary':'btn-ghost'}">${t.label}</a>`).join("")}
  </div>`;
}

function viewAdminPanel(params){
  const products = allProducts();
  const cats = allCategoryLabels();
  const categories = allCategories();
  const tab = params.tab || "dashboard";
  const editId = params.edit || "";
  const editing = editId ? products.find(p=>p.id===editId) : null;

  /* Product form's category dropdown: grouped by the fixed groups, options are admin-managed categories.
     Choosing a category also fixes the product's group (category.group), so group is never picked directly. */
  const catOptions = FIXED_GROUPS.map(g=>{
    const opts = categoriesByGroup(g).map(c=>
      `<option value="${c.id}" ${editing && editing.category===c.name && editing.group===g ? "selected":""}>${escapeHtml(c.name)}</option>`
    ).join("");
    return opts ? `<optgroup label="${escapeHtml(cats[g]||g)}">${opts}</optgroup>` : "";
  }).join("");

  const head = `
  <section class="page-head">
    <div class="container" style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <div>
        <p class="breadcrumb"><a href="#/">Home</a> / Admin panel</p>
        <h1 class="page-title">Admin panel</h1>
        <p class="page-desc">Manage products, categories and homepage content. Changes apply immediately across the site.</p>
        ${adminTabBar(tab)}
      </div>
      <button class="btn btn-secondary btn-sm" id="adminLogoutBtn">Log out</button>
    </div>
  </section>`;

  if(tab === "dashboard") return head + viewAdminDashboard(products, cats);
  if(tab === "homepage") return head + viewAdminHomepage();
  if(tab === "categories") return head + viewAdminCategories(cats, products, params);
  if(tab === "orders") return head + viewAdminOrders(params);
  if(tab === "settings") return head + viewAdminSettings();
  return head + viewAdminProducts(products, cats, editing, catOptions);
}

function orderStatusBadge(status){

}

/* Wires an <input type=file> to read the chosen image as a data URL into a hidden
   input (id) and update its preview <div id+"Preview">. Keeps everything client-side. */
function wireImageInput(fileId, hiddenId, previewId){
  const fileEl = document.getElementById(fileId);
  if(!fileEl) return;
  fileEl.addEventListener("change", ()=>{
    const file = fileEl.files && fileEl.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      document.getElementById(hiddenId).value = reader.result;
      const prev = document.getElementById(previewId);
      if(prev) prev.innerHTML = `<img src="${reader.result}" style="width:100%;border-radius:4px;border:1px solid var(--line);">`;
    };
    reader.readAsDataURL(file);
  });
}

function afterAdminPanel(){

    AdminStore.logout();
    location.hash = "#/admin";
  });

  const productForm = document.getElementById("adminProductForm");
  if(productForm){
    wireImageInput("pfImgFile", "pfImg", "pfImgPreview");

      e.preventDefault();

      const existingImg = document.getElementById("pfImg").value;

        id,
        name: document.getElementById("pfName").value.trim(),
        category: cat.name,
        group: cat.group,
        price: Number(document.getElementById("pfPrice").value) || 0,
        img: existingImg || (findProduct(id) && findProduct(id).img) || Object.values(IMG)[0],
        rating: Number(document.getElementById("pfRating").value) || 4.5,

        color: document.getElementById("pfColor").value.trim(),
        desc: document.getElementById("pfDesc").value.trim(),
        featured: document.getElementById("pfFeatured").checked
      };
      AdminStore.upsertProduct(p);
      showToast(document.getElementById("pfId").value ? "Product updated" : "Product added");
      location.hash = "#/admin/panel?tab=products";
      if(location.hash === "#/admin/panel?tab=products") render();

  document.querySelectorAll("[data-del-prod]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-del-prod");
      if(confirm("Delete this product? It will be removed from the catalogue.")){
        AdminStore.deleteProduct(id);
        showToast("Product deleted");
        render();
      }
    });
  });

  const catForm = document.getElementById("adminCategoryForm");
  if(catForm){
    catForm.addEventListener("submit", e=>{
      e.preventDefault();
      const existingId = document.getElementById("cfId").value;
      const name = document.getElementById("cfName").value.trim();
      if(!name) return;
      let cat;
      if(existingId){
        // Editing: group is fixed/disabled in the form, so keep the category's existing group.
        const current = allCategories().find(c=>c.id===existingId);
        cat = { id: existingId, name, group: current ? current.group : document.getElementById("cfGroupSel").value };
      } else {
        const group = document.getElementById("cfGroupSel").value;
        if(!FIXED_GROUPS.includes(group)) return;
        cat = { id: AdminStore.nextCategoryId(group), name, group };
      }
      AdminStore.upsertCategory(cat);
      showToast(existingId ? "Category updated" : "Category added");
      location.hash = "#/admin/panel?tab=categories";
      if(location.hash === "#/admin/panel?tab=categories") render();
    });
  }

  document.querySelectorAll("[data-del-cat]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-del-cat");
      const cat = allCategories().find(c=>c.id===id);
      const inUse = cat && allProducts().some(p=>p.category===cat.name && p.group===cat.group);
      if(inUse){ showToast("Can't remove — products still use this category"); return; }
      if(confirm("Remove this category?")){
        AdminStore.deleteCategory(id);
        showToast("Category removed");
        render();
      }

  /* ---- Homepage editor forms (only present on the Homepage tab) ---- */
  wireImageInput("heroImgFile", "heroImg", "heroImgPreview");
  wireImageInput("aboutImgFile", "aboutImg", "aboutImgPreview");
  wireImageInput("promoImgFile", "promoImg", "promoImgPreview");

  const heroForm = document.getElementById("heroForm");

    heroForm.addEventListener("submit", e=>{
      e.preventDefault();
      const v = id=>document.getElementById(id).value;
      AdminStore.saveHome({ hero: {
        visible: document.getElementById("heroVisible").checked,
        kicker: v("heroKicker"), heading: v("heroHeading"), lead: v("heroLead"),
        btn1Text: v("heroBtn1Text"), btn1Link: v("heroBtn1Link"),
        btn2Text: v("heroBtn2Text"), btn2Link: v("heroBtn2Link"),
        mark1Num: v("heroMark1Num"), mark1Label: v("heroMark1Label"),
        mark2Num: v("heroMark2Num"), mark2Label: v("heroMark2Label"),
        mark3Num: v("heroMark3Num"), mark3Label: v("heroMark3Label"),

      showToast("Hero saved");
      render();
    });
  }

  const featuredForm = document.getElementById("featuredForm");
  if(featuredForm){
    featuredForm.addEventListener("submit", e=>{
      e.preventDefault();
      const v = id=>document.getElementById(id).value;

        featured2: { visible: document.getElementById("f2Visible").checked, title: v("f2Title"), sub: v("f2Sub"), group: v("f2Group").trim() }

      render();

  const aboutForm = document.getElementById("aboutForm");
  if(aboutForm){
    aboutForm.addEventListener("submit", e=>{
      e.preventDefault();
      const v = id=>document.getElementById(id).value;
      AdminStore.saveHome({ about: {
        visible: document.getElementById("aboutVisible").checked,
        heading: v("aboutHeading"), body: v("aboutBody"),
        stat1Num: v("aboutStat1Num"), stat1Label: v("aboutStat1Label"),

        img: v("aboutImg"), alt: (homeContent().about.alt)
      }});
      showToast("About section saved");
      render();
    });
  }

  const promoForm = document.getElementById("promoForm");
  if(promoForm){
    promoForm.addEventListener("submit", e=>{
      e.preventDefault();
      const v = id=>document.getElementById(id).value;
      AdminStore.saveHome({ promo: {
        visible: document.getElementById("promoVisible").checked,

        btnText: v("promoBtnText"), btnLink: v("promoBtnLink"),
        img: v("promoImg"), alt: (homeContent().promo.alt)
      }});
      showToast("Promo banner saved");
      render();
    });
  }

  const collectionsForm = document.getElementById("collectionsForm");
  if(collectionsForm){
    collectionsForm.addEventListener("submit", e=>{
      e.preventDefault();
      const cur = homeContent().collections;
      const updated = cur.map((c,i)=>({
        ...c,

        title: document.getElementById("colTitle"+i).value,
        href: document.getElementById("colHref"+i).value

      AdminStore.saveHome({ collections: updated });

      render();

  /* ---- Orders tab ---- */
  const statusSelect = document.getElementById("orderStatusSelect");
  if(statusSelect){
    statusSelect.addEventListener("change", ()=>{
      AdminStore.updateOrderStatus(statusSelect.dataset.orderId, statusSelect.value);
      showToast("Order status updated");

    });
  }
  document.querySelectorAll("[data-del-order]").forEach(btn=>{

  /* ---- Settings tab ---- */

        email: v("stEmail").trim(),

  const exportBtn = document.getElementById("exportDataBtn");
  if(exportBtn){
    exportBtn.addEventListener("click", ()=>{

        products: AdminStore.getOverrides(),
        deleted: AdminStore.getDeleted(),
        categories: AdminStore.getCatOverrides(),
        categoriesDeleted: AdminStore.getCatDeleted(),
        home: AdminStore.getHome(),
        orders: AdminStore.getOrders(),
        settings: AdminStore.getSettings(),
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "prabot-admin-backup.json";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast("Backup downloaded");
    });
  }
  const importFile = document.getElementById("importDataFile");
  if(importFile){
    importFile.addEventListener("change", ()=>{
      const file = importFile.files && importFile.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(data.products) AdminStore.write(AdminStore.prodKey, data.products);
          if(data.deleted) AdminStore.write(AdminStore.delKey, data.deleted);
          if(data.categories) AdminStore.write(AdminStore.catKey, data.categories);
          if(data.categoriesDeleted) AdminStore.write(AdminStore.catDelKey, data.categoriesDeleted);
          if(data.home) AdminStore.write(AdminStore.homeKey, data.home);
          if(data.orders) AdminStore.saveOrders(data.orders);
          if(data.settings) AdminStore.saveSettings(data.settings);
          showToast("Data restored");
          render();
        }catch(err){
          showToast("Invalid backup file");
        }
      };
      reader.readAsText(file);
    });
  }
}


/* ---------------- Motion helpers ---------------- */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let revealObserver;
function setupReveals(){
  if(reduceMotion) return;
  if(revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach((en,i)=>{
      if(en.isIntersecting){
        const el = en.target;
        el.style.transitionDelay = Math.min(parseInt(el.dataset.i||0,10)*55, 280) + "ms";
        el.classList.add("in");
        revealObserver.unobserve(el);
      }
    });
  }, { rootMargin:"0px 0px -60px 0px", threshold:.08 });
  document.querySelectorAll("#app .section-head, #app .product-card, #app .collection-card, #app .cat-card, #app .value-card, #app .promo, #app .about-grid > *, #app .filters, #app .empty-state").forEach(el=>{
    if(el.classList.contains("in")) return;
    el.classList.add("reveal");
    revealObserver.observe(el);
  });
}
function groupStagger(){
  document.querySelectorAll("#app .product-grid, #app .grid-collections, #app .cat-rail, #app .value-grid").forEach(grid=>{
    [...grid.children].forEach((c,i)=>{ c.dataset.i = i % 8; });
  });
}
window.addEventListener("scroll", ()=>{
  const h = document.querySelector(".site-header");
  if(h) h.classList.toggle("scrolled", window.scrollY > 8);
}, { passive:true });

/* ---------------- Router ---------------- */
function parseHash(){
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const params = {};
  new URLSearchParams(qs||"").forEach((v,k)=>params[k]=v);
  return { route: parts[0] || "home", id: parts[1] || "", params };
}

function render(){
  document.body.classList.remove("nav-locked");
  const { route, id, params } = parseHash();
  const app = document.getElementById("app");
  let active = route, html = "", after = null;

  switch(route){
    case "home": html = viewHome(); after = afterHome; break;
    case "shop":
      html = viewShop(params); after = ()=>afterShop(params);
      active = params.cat === "office" ? "office" : params.cat === "gaming" ? "gaming" : "shop";
      break;
    case "search": html = viewSearch(params); after = ()=>afterSearch(params); break;
    case "product": html = viewProduct(id); after = ()=>afterProduct(id); break;
    case "cart": html = viewCart(); after = afterCart; break;
    case "checkout": html = viewCheckout(); after = afterCheckout; break;
    case "order-confirmed": html = viewOrderConfirmed(id); break;
    case "wishlist": html = viewWishlist(); break;
    case "about": html = viewAbout(); break;
    case "contact": html = viewContact(); after = afterContact; break;
    case "admin":
      if(id === "panel" && AdminStore.isLoggedIn()){ html = viewAdminPanel(params); after = afterAdminPanel; }
      else { html = viewAdminLogin(); after = afterAdminLogin; }
      break;
    default: html = notFound();
  }

  renderHeader(active, route==="search" ? (params.q||"") : "");
  app.innerHTML = html;
  if(after) after();
  renderFooter();
  groupStagger();
  setupReveals();
  syncHeaderHeight();
  window.scrollTo(0,0);
}

/* ---- Keep --header-total in sync with the real rendered header ----
   The mobile layout stacks a search bar under the header row, and its
   height changes with font-size / wrapping. Measuring beats hardcoding. */
function syncHeaderHeight(){
  const h = document.querySelector(".site-header");
  if(!h) return;
  const px = Math.round(h.getBoundingClientRect().height);
  if(px > 0) document.documentElement.style.setProperty("--header-total", px + "px");
}
if(window.ResizeObserver){
  const ro = new ResizeObserver(syncHeaderHeight);
  const hr = document.getElementById("headerRoot");
  if(hr) ro.observe(hr);
}
window.addEventListener("resize", syncHeaderHeight);
window.addEventListener("orientationchange", ()=>setTimeout(syncHeaderHeight,150));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeaderHeight);

window.addEventListener("hashchange", render);
render();
syncHeaderHeight();
</script>
