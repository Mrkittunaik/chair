<script>
/* AUTO HARD-REFRESH: when any site file (JS/CSS) changes on the server, every open device clears its caches and reloads by itself. */
(function(){
  var KEY="adil_build", LAST="adil_reload_at";
  function files(){ var a=[].slice.call(document.querySelectorAll('script[src],link[rel=stylesheet][href]')).map(function(e){return e.src||e.href;});
    return a.filter(function(u){ return u.indexOf(location.origin)===0 && /\/(js|css)\//.test(u); }); }
  function hash(t){ var h=0; for(var i=0;i<t.length;i++){ h=(h*31+t.charCodeAt(i))|0; } return h+":"+t.length; }
  async function sig(){
    var f=files(), out=[];
    for(var i=0;i<f.length;i++){ try{ var r=await fetch(f[i],{cache:"no-store"}); out.push(r.ok?hash(await r.text()):"x"); }catch(e){ return null; } }
    return out.join("|");
  }
  async function hardRefresh(){
    var last=+sessionStorage.getItem(LAST)||0; if(Date.now()-last<45000) return;   /* never loop */
    sessionStorage.setItem(LAST,String(Date.now()));
    try{ if(window.caches){ var k=await caches.keys(); await Promise.all(k.map(function(x){return caches.delete(x);})); } }catch(e){}
    try{ if(navigator.serviceWorker){ var rg=await navigator.serviceWorker.getRegistrations(); await Promise.all(rg.map(function(x){return x.unregister();})); } }catch(e){}
    try{ await Promise.all(files().map(function(u){ return fetch(u,{cache:"reload"}); })); }catch(e){}
    location.reload();
  }
  async function check(){
    if(document.hidden) return;
    var s=await sig(); if(!s) return;
    var old=null; try{ old=localStorage.getItem(KEY); }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
    if(old && old!==s) hardRefresh();
  }
  window.addEventListener("load",function(){ setTimeout(check,1500); });
  document.addEventListener("visibilitychange",check);
  window.addEventListener("focus",check);
  window.addEventListener("pageshow",function(e){ if(e.persisted) check(); });
  setInterval(check,60000);
})();
</script>
